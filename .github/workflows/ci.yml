# Continuous integration.
#
# Three Python gates and one frontend gate, in separate jobs so a lint failure
# and a test failure are reported together rather than one hiding the other.
#
# Migrations are NOT run automatically on boot anywhere (implementation plan
# §12); here they run as an explicit step, which is also what exercises them —
# the tests migrate a scratch database rather than calling `create_all`, because
# it is the migrations that ship.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml, so a failure reproduces locally with the same
  # connection string.
  DATABASE_URL: postgresql+psycopg://scrapr:scrapr_local_dev_only@localhost:5432/scrapr

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check packages/ services/

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # The type checker is the enforcement mechanism for the trust boundary
      # (§9), not a nice-to-have: security, llm and tools are checked with no
      # escape hatches at all.
      - run: uv run mypy packages/scrapr_core/src services

  test:
    name: pytest + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scrapr
          POSTGRES_PASSWORD: scrapr_local_dev_only
          POSTGRES_DB: scrapr
        ports:
          - 5432:5432
        # Without this the first connection races the server's startup.
        options: >-
          --health-cmd "pg_isready -U scrapr -d scrapr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # Object storage, as docker compose provides it locally (`DEC-12`). A
      # service container cannot pass MinIO its `server` argument, so it is
      # started here. Without it the upload, storage and export suites skip.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=scrapr -e MINIO_ROOT_PASSWORD=scrapr_local_dev_only \
            quay.io/minio/minio server /data
          for _ in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 1; done
          uv run python -c "import boto3; boto3.client('s3', endpoint_url='http://localhost:9000', aws_access_key_id='scrapr', aws_secret_access_key='scrapr_local_dev_only', region_name='auto').create_bucket(Bucket='scrapr-uploads')"
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Run tests
        # The 80% floor is configured in pyproject.toml, so it cannot differ
        # between a developer machine and CI.
        run: uv run pytest --cov

  contract:
    name: openapi contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --group dev
      # The committed document must match the application. A stale contract is
      # a frontend generated against routes that no longer exist.
      - name: Check openapi.json is current
        run: uv run python packages/contracts/export_openapi.py --check
      - run: npm ci
        working-directory: apps/web
      # And the committed TS types must match the document, so the break lands
      # here rather than in a runtime shape mismatch nobody typed against.
      - name: Check generated types are current
        run: npm run check:api
        working-directory: apps/web

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scrapr
          POSTGRES_PASSWORD: scrapr_local_dev_only
          POSTGRES_DB: scrapr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrapr -d scrapr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      # Exports and uploads go to object storage, so the browser suite needs it.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=scrapr -e MINIO_ROOT_PASSWORD=scrapr_local_dev_only \
            quay.io/minio/minio server /data
          for _ in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 1; done
          uv run python -c "import boto3; boto3.client('s3', endpoint_url='http://localhost:9000', aws_access_key_id='scrapr', aws_secret_access_key='scrapr_local_dev_only', region_name='auto').create_bucket(Bucket='scrapr-uploads')"

      # The API and the worker, so the suite exercises the real flow rather
      # than a mocked one. The worker is what turns run_steps into a report.
      - name: Start the API
        run: uv run uvicorn scrapr_api.main:app --port 8000 &
      - name: Start the worker
        run: uv run scrapr-worker &
      - name: Wait for the API
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "the API never became healthy" >&2
          exit 1

      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Playwright builds and serves the app itself: a dev build is not what
      # ships, and its timing is nothing like production's.
      - run: npm run e2e
        working-directory: apps/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  lighthouse:
    name: lighthouse budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Performance 90+ is a design-system non-negotiable, so a regression
      # fails the build rather than being noticed later by a user.
      - run: npm run lighthouse

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
