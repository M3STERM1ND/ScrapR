# Alembic configuration.
#
# The database URL is deliberately absent: it is read from the environment by
# migrations/env.py via scrapr_core.config, so a developer machine, CI and
# production cannot end up migrating a database that differs from the one the
# application connects to.
#
# Migrations run as a gated deployment step, never automatically on boot
# (implementation plan section 12), so that two developers cannot race a schema
# change.

[alembic]
script_location = packages/scrapr_core/src/scrapr_core/db/migrations
prepend_sys_path = packages/scrapr_core/src

# Split prepend_sys_path on the OS path separator rather than Alembic's legacy
# rule of splitting on spaces, commas and colons, which mangles a Windows path.
path_separator = os

# Filename prefix: a zero-padded sequence plus a slug, so `ls versions/` reads
# in dependency order. Alembic's own ordering comes from down_revision; this is
# purely for humans.
file_template = %%(rev)s_%%(slug)s

# UTC, because a migration timestamp compared across two developers' machines is
# otherwise meaningless.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
