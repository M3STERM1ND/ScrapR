# Local development dependencies only. Production topology is infra/ and is
# still open: where workers execute and what dispatches them is OPEN-03.
#
# Postgres is the durable source of truth for job state (implementation plan
# section 5.6), which is what lets a single-process local runner satisfy every
# Phase 1 requirement without a queue existing yet.

services:
  postgres:
    image: postgres:17-alpine
    container_name: scrapr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrapr
      POSTGRES_PASSWORD: scrapr_local_dev_only
      POSTGRES_DB: scrapr
      # Deterministic collation, so ordering does not drift between a developer
      # machine and CI.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Without a healthcheck, `docker compose up -d` returns before Postgres is
      # accepting connections and the first migration run races it.
      test: ["CMD-SHELL", "pg_isready -U scrapr -d scrapr"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Object storage, S3-compatible (`DEC-12`). The application speaks the S3 API
  # and nothing else, so this is the same client production uses against R2 —
  # only the endpoint and credentials differ. Implementation plan §13 asks for
  # local development to run on "Postgres and storage", and an upload path that
  # exists only in production is one nobody tests.
  minio:
    image: quay.io/minio/minio:latest
    container_name: scrapr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scrapr
      MINIO_ROOT_PASSWORD: scrapr_local_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Creates the bucket and exits. Without this, a fresh clone would need a
  # console visit before the first upload — which is exactly the manual setup
  # step this compose file exists to avoid.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: scrapr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 scrapr scrapr_local_dev_only &&
      mc mb --ignore-existing local/scrapr-uploads &&
      mc anonymous set none local/scrapr-uploads &&
      echo 'bucket ready, private'
      "

volumes:
  postgres_data:
    name: scrapr_postgres_data
  minio_data:
    name: scrapr_minio_data
