[project]
name = "scrapr-core"
version = "0.1.0"
description = "All ScrapR domain logic. The api and worker entrypoints are thin wrappers over this package, so that where workers run stays a deployment choice rather than a refactor (OPEN-03)."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Page fetch (`REQ-TOOL-003`) is the one tool that opens a connection
    # itself rather than through a vendor SDK, so the HTTP client is a
    # runtime dependency of the core rather than a test one.
    "httpx>=0.28",
    # `DEC-06`: Anthropic is the AI provider. The SDK, not raw HTTP —
    # structured output and the thinking parameters differ per model and
    # the SDK is what tracks them.
    "anthropic>=0.40",
    # `DEC-12`: the S3 API is the storage contract, so one client serves both
    # MinIO locally and R2 in production.
    "boto3>=1.35",
    # `DEC-14` extraction, one library per format. All pure-Python and all
    # small; a scanned PDF that yields no text is a failed upload, not an OCR
    # dependency (`REQ-DOC-004 AC-3`).
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapr_core"]
