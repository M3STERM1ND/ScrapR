[project]
name = "scrapr-worker"
version = "0.1.0"
description = "Worker entrypoint. Claims a runnable step, executes it, checkpoints, releases. Thin by design; all domain logic lives in scrapr-core."
requires-python = ">=3.12"
dependencies = [
    "scrapr-core",
]

[project.scripts]
scrapr-worker = "scrapr_worker.main:main"

[tool.uv.sources]
scrapr-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapr_worker"]
